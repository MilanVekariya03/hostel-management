apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hostel

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: milan12344/hostel-backend:BUILD_NUMBER

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: PORT
              value: "5000"

            - name: MONGO_URL
              value: "mongodb://mongodb:27017/hosteldb"

          resources:
            requests:
              memory: "80Mi"
              cpu: "50m"

            limits:
              memory: "200Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: hostel

spec:
  selector:
    app: backend

  ports:
    - port: 5000
      targetPort: 5000

  type: ClusterIP
