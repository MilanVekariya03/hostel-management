apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hostel-management
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/MilanVekariya03/hostel-management.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: hostel

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
