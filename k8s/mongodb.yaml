apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: hostel
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017

          resources:
            requests:
              memory: "150Mi"
              cpu: "50m"

            limits:
              memory: "300Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: hostel

spec:
  selector:
    app: mongodb

  ports:
    - port: 27017
      targetPort: 27017

  type: ClusterIP
